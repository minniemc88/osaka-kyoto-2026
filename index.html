                ],

                shopping: ["WINSTON CASTER WHITE 5", "暖腳襪 (唐吉柯德)", "白色御守 (下鴨神社)"]
            },
            contract: [
                { id: 1, binReq: "不要一直拍照，\n一個景點幫拍最多10張，合照5張", minAgree: "🤏至少要有好看的", minReq: "不要擺臭臉、不說話（累了除外）", binAgree: "✅" },
                { id: 2, binReq: "不能嫌走路累(不舒服可以說)", minAgree: "✅會哭夭但會繼續走", minReq: "意見不同就溝通想辦法", binAgree: "✅" },
                { id: 3, binReq: "確定行程再行動", minAgree: "✅", minReq: "吵架不可以說難聽的話", binAgree: "✅" },
                { id: 4, binReq: "有什麼事直接討論，我不想猜", minAgree: "✅", minReq: "迷路或帶錯路不能生氣", binAgree: "✅" },
                { id: 5, binReq: "以下空白", minAgree: null, minReq: "不能嫌棄對方的景點，因為這是一起討論的", binAgree: "✅" },

        // 預設 Money 資料
        const defaultMoney = {
            common: [
                { item: "關西—難波", cost: 562, payer: "彬彬" },

                { item: "觀景台", cost: 640, payer: "彬彬" },
                { item: "京都住宿", cost: 6155, payer: "米妮" },
                { item: "高鐵票", cost: 970, payer: "彬彬" }
            ],
            personal: [
                { item: "機票", cost: 17947 },
                { item: "保險", cost: 414 },
                { item: "🍉 Suica卡", cost: 201 },
                { item: "飯店", cost: 6157 },
                { item: "高鐵 (雲林-台中)", cost: 205 },
                { item: "高鐵 (台中-桃園)", cost: 485 }
            ]
        };

        let liveMoneyData = null;
        let lastUpdateStr = "";
        let currentDayId = 1;
        const appContent = document.getElementById('app-content');
        const headerSubtitle = document.getElementById('header-subtitle');
        const daySelector = document.getElementById('day-selector');

        function init() {
            renderDaySelector();
            switchTab('itinerary');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget?.classList.add('active');
            
            daySelector.style.display = (tabName === 'itinerary') ? 'flex' : 'none';

            if (tabName === 'itinerary') {
                headerSubtitle.innerText = staticData.days.find(d => d.id === currentDayId).date;
                renderItinerary(currentDayId);
            } else if (tabName === 'info') {
                headerSubtitle.innerText = "航班與住宿";
                renderInfo();
            } else if (tabName === 'money') {
                headerSubtitle.innerText = "預算管理";
                renderMoney();
                if (!liveMoneyData && !GOOGLE_SHEET_CSV_URL.includes('請將您')) {
                    fetchMoneyData();
                }
            } else if (tabName === 'contract') {
                headerSubtitle.innerText = "不吵架契約";
                renderContract(); 
            }
            window.scrollTo(0,0);
        }

        async function fetchMoneyData() {
            const btn = document.getElementById('sync-money-btn');
            const status = document.getElementById('money-status');
            
            if(btn) {
                btn.disabled = true;
                btn.innerHTML = `<i class="fas fa-sync-alt fa-spin-fast mr-1"></i> 讀取中`;
            }

            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL + '&t=' + new Date().getTime());
                if (!response.ok) throw new Error("Network error");
                const text = await response.text();
                
                if (text.trim().startsWith("<!DOCTYPE html>")) throw new Error("HTML received");

                const rows = parseCSV(text);
                parseMoneyData(rows);
                renderMoney();

                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                if(status) status.innerText = `最後更新: ${timeStr}`;

            } catch (error) {
                console.error("Fetch error:", error);
                if(status) status.innerText = "❌ 更新失敗，顯示預設資料";
            } finally {
                if(btn) {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fas fa-sync-alt mr-1"></i> 更新`;
                }
            }
        }

        function parseCSV(text) {
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let insideQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    if (insideQuotes && text[i+1] === '"') { currentCell += '"'; i++; }
                    else { insideQuotes = !insideQuotes; }
                } else if (char === ',' && !insideQuotes) {
                    currentRow.push(currentCell.trim());
                    currentCell = '';
                } else if ((char === '\r' || char === '\n') && !insideQuotes) {
                    if (currentCell || currentRow.length > 0) currentRow.push(currentCell.trim());
                    if (currentRow.length > 0) rows.push(currentRow);
                    currentRow = [];
                    currentCell = '';
                    if (char === '\r' && text[i+1] === '\n') i++; 
                } else {
                    currentCell += char;
                }
            }
            if (currentCell) currentRow.push(currentCell.trim());
            if (currentRow.length > 0) rows.push(currentRow);
            return rows;
        }

        function parseMoneyData(rows) {
            const newCommon = [];
            const newPersonal = [];
            
            for (let i = 2; i < rows.length; i++) {
                const row = rows[i];
                if (!row) continue;

                // 左邊：共同
                if (row.length > 0 && row[0]) {
                    let cost = parseInt(row[1]?.replace(/,/g, '')) || 0;
                    let payer = row[2] || "未標註";
                    if(payer.includes("彬")) payer = "彬彬";
                    if(payer.includes("米")) payer = "米妮";
                    newCommon.push({ item: row[0], cost: cost, payer: payer });
                }
                
                // 右邊：個人 (寬鬆判斷，只要該行有足夠欄位)
                if (row.length > 9 && row[9]) {
                    let cost = parseInt(row[10]?.replace(/,/g, '')) || 0;
                    newPersonal.push({ item: row[9], cost: cost });
                }
            }
            liveMoneyData = { common: newCommon, personal: newPersonal };
        }

        // 行程
        function renderItinerary(dayId) {
            const day = staticData.days.find(d => d.id === dayId);
            let html = `<div class="bg-blue-50 text-blue-800 p-3 rounded-lg text-sm mb-2 flex items-center shadow-sm"><i class="fas fa-info-circle mr-2 text-lg"></i><span>${day.note}</span></div>`;
            html += day.events.map(e => `
                <div class="card p-4 relative flex items-start gap-4">
                    <div class="flex flex-col items-center min-w-[50px]">
                        <span class="text-xs font-bold text-gray-400 mb-1">${e.time}</span>
                        <div class="w-10 h-10 rounded-full ${getTypeColor(e.type)} flex items-center justify-center text-white shadow-sm"><i class="fas ${e.icon}"></i></div>
                    </div>
                    <div class="flex-1 pt-1">
                        <h3 class="font-bold text-gray-800 text-lg leading-tight">${e.title}</h3>
                        <p class="text-sm text-gray-500 mt-1 mb-2 whitespace-pre-line">${e.desc}</p>
                        ${e.nav ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.nav)}" target="_blank" class="inline-flex items-center text-xs bg-gray-100 text-gray-600 px-3 py-1.5 rounded-full hover:bg-gray-200"><i class="fas fa-location-arrow mr-1.5"></i> 導航</a>` : ''}
                    </div>
                </div>`).join('');
            appContent.innerHTML = html;
        }

        // 帳務
        function renderMoney() {
            const data = liveMoneyData || defaultMoney;
            const commonTotal = data.common.reduce((sum, item) => sum + item.cost, 0);
            const personalTotal = data.personal.reduce((sum, item) => sum + item.cost, 0);
            const grandTotal = commonTotal + personalTotal;

            let html = `

                        <i class="fas fa-sync-alt mr-1"></i> 更新
                    </button>
                </div>
                
                <div class="flex gap-2 mb-4">
                    <button onclick="calculateSettlement()" class="flex-1 bg-gradient-to-r from-gray-800 to-gray-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg active:scale-95 transition-transform flex justify-center items-center">
                        <i class="fas fa-coins mr-2 text-yellow-400"></i> 結算：誰要給誰錢？
                    </button>
                </div>
                <div id="settlement-container"></div>

                <div class="card p-0 overflow-hidden mb-4 border-emerald-200 border">
                    <div class="bg-emerald-500 p-4 text-white flex justify-between items-end">
                        <div><p class="text-xs opacity-80 mb-1">公費總支出</p><p class="text-2xl font-bold">NT$ ${commonTotal.toLocaleString()}</p></div>
                        <i class="fas fa-users text-4xl opacity-20"></i>
                    </div>
                    <div class="p-0">
                        <table class="w-full text-sm">
                            <thead class="bg-gray-50 text-gray-500 text-xs border-b border-gray-100">
                                <tr><th class="text-left p-3 font-normal">項目</th><th class="text-right p-3 font-normal">金額</th><th class="text-center p-3 font-normal w-16">先付</th></tr>
                            </thead>
                            <tbody>
                            ${data.common.map(m => `
                                <tr class="border-b last:border-0 border-gray-100">
                                    <td class="p-3 text-gray-700 font-medium">${m.item}</td>
                                    <td class="p-3 text-right font-mono text-gray-600">$${m.cost.toLocaleString()}</td>
                                    <td class="p-3 text-center"><span class="text-[10px] px-2 py-1 rounded-full whitespace-nowrap ${m.payer.includes('米') ? 'bg-pink-100 text-pink-600' : 'bg-blue-100 text-blue-600'}">${m.payer.includes('米')?'👩🏻':'👦🏻'} ${m.payer}</span></td>
                                </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card p-0 overflow-hidden mb-4 border-pink-200 border">
                    <div class="bg-pink-500 p-4 text-white flex justify-between items-end">
                        <div><p class="text-xs opacity-80 mb-1">米妮個人支出</p><p class="text-2xl font-bold">NT$ ${personalTotal.toLocaleString()}</p></div>
                        <i class="fas fa-shopping-bag text-4xl opacity-20"></i>
                    </div>
                    <div class="p-0">
                        <table class="w-full text-sm">
                            ${data.personal.map(m => `
                                <tr class="border-b last:border-0 border-gray-100">
                                    <td class="p-3 text-gray-600">${m.item}</td>
                                    <td class="p-3 text-right font-mono font-medium text-gray-800">$${m.cost.toLocaleString()}</td>
                                </tr>`).join('')}
                        </table>
                    </div>
                </div>

                <div class="card p-4 bg-gray-800 text-white shadow-lg">
                    <h3 class="text-center text-sm text-gray-400 mb-2">📊 整趟旅程總支出</h3>
                    <div class="flex justify-between items-center text-xs mb-1">
                        <span>公費</span><span>$${commonTotal.toLocaleString()}</span>
                    </div>
                    <div class="flex justify-between items-center text-xs mb-3 border-b border-gray-700 pb-2">
                        <span>個人</span><span>$${personalTotal.toLocaleString()}</span>
                    </div>
                    <div class="text-center">
                        <span class="text-3xl font-bold text-yellow-400">$${grandTotal.toLocaleString()}</span>
                    </div>
                </div>
            `;
            appContent.innerHTML = html;
        }

        function calculateSettlement() {
            const data = liveMoneyData || defaultMoney;
            let binPaid = 0;
            let minPaid = 0;
            data.common.forEach(m => {
                if (m.payer.includes("彬")) binPaid += m.cost;
                else if (m.payer.includes("米")) minPaid += m.cost;
            });
            const diff = binPaid - minPaid;
            const amountToPay = Math.abs(diff / 2);
            let resultHtml = "";
            let colorClass = "";
            
            if (diff > 0) {
                colorClass = "border-blue-500 bg-blue-50 text-blue-800";
                resultHtml = `<div class="font-bold text-lg mb-1">米妮 👩🏻 ➜ 給 彬彬 👦🏻</div><div class="text-2xl font-bold">NT$ ${Math.floor(amountToPay).toLocaleString()}</div><div class="text-xs text-gray-500 mt-2">彬先付: $${binPaid.toLocaleString()} / 妮先付: $${minPaid.toLocaleString()}</div>`;
            } else if (diff < 0) {
                colorClass = "border-pink-500 bg-pink-50 text-pink-800";
                resultHtml = `<div class="font-bold text-lg mb-1">彬彬 👦🏻 ➜ 給 米妮 👩🏻</div><div class="text-2xl font-bold">NT$ ${Math.floor(amountToPay).toLocaleString()}</div><div class="text-xs text-gray-500 mt-2">妮先付: $${minPaid.toLocaleString()} / 彬先付: $${binPaid.toLocaleString()}</div>`;
            } else {
                colorClass = "border-green-500 bg-green-50 text-green-800";
                resultHtml = `<div class="font-bold">🎉 雙方付的一樣多！</div>`;
            }
            document.getElementById('settlement-container').innerHTML = `<div class="result-box p-4 rounded-xl border-2 text-center shadow-sm mb-4 ${colorClass}">${resultHtml}</div>`;
        }

        // 合約
        function renderContract() {
            const data = staticData.contract;
            let binSectionHtml = `<div class="card p-5 mb-4 border-l-4 border-blue-400"><div class="text-blue-700 font-bold mb-3"><i class="fas fa-male mr-2 text-xl"></i> 彬彬哥的要求</div><div class="text-sm">`;
            data.forEach(row => { if (row.binReq) binSectionHtml += `<div class="contract-item"><div class="font-medium text-gray-800 mb-1">${row.binReq}</div>${row.minAgree ? `<div class="text-gray-500 text-xs">👩🏻 米妮回應：<span class="text-pink-600 font-bold">${row.minAgree}</span></div>` : ''}</div>`; });
            binSectionHtml += `</div></div>`;

            let minSectionHtml = `<div class="card p-5 mb-4 border-l-4 border-pink-400"><div class="text-pink-700 font-bold mb-3"><i class="fas fa-female mr-2 text-xl"></i> 米妮的要求</div><div class="text-sm">`;
            data.forEach(row => { if (row.minReq) minSectionHtml += `<div class="contract-item"><div class="font-medium text-gray-800 mb-1">${row.minReq}</div>${row.binAgree ? `<div class="text-gray-500 text-xs">👦🏻 彬彬回應：<span class="text-blue-600 font-bold">${row.binAgree}</span></div>` : ''}</div>`; });
            minSectionHtml += `</div></div>`;

            appContent.innerHTML = `<div class="text-center text-sm text-gray-500 mb-4">📜 雙方不吵架條約</div>` + binSectionHtml + minSectionHtml + `<div class="mt-8 pt-6 border-t border-gray-200 text-center"><h3 class="text-lg font-bold text-gray-700 mb-2">願我們的旅程充滿快樂與愛 🩵</h3><div class="grid grid-cols-2 gap-8 mt-6"><div class="text-center"><div class="border-b-2 border-gray-300 w-24 mx-auto mb-2"></div><span class="text-xs text-gray-400">彬彬哥 (簽署)</span></div><div class="text-center"><div class="border-b-2 border-gray-300 w-24 mx-auto mb-2"></div><span class="text-xs text-gray-400">米妮 (簽署)</span></div></div></div>`;
        }

        // 資訊
        function renderInfo() {
            const info = staticData.info;
            appContent.innerHTML = `
                <div class="card p-4 mb-4"><h3 class="font-bold border-b pb-2 mb-3"><i class="fas fa-shopping-cart text-pink-500 mr-2"></i>必買清單</h3><ul class="space-y-2">${info.shopping.map(item => `<li class="flex items-center text-sm"><i class="far fa-check-circle text-pink-300 mr-2"></i>${item}</li>`).join('')}</ul></div>
                <div class="card p-4 mb-4"><h3 class="font-bold border-b pb-2 mb-3"><i class="fas fa-suitcase-rolling text-blue-500 mr-2"></i>行前確認</h3><div class="flex flex-wrap gap-2">${info.checkList.map(i => `<span class="bg-yellow-50 text-yellow-700 text-xs px-2 py-1 rounded border border-yellow-200">${i}</span>`).join('')}</div></div>
                ${info.flights.map(f => `<div class="card p-4 border-l-4 border-blue-500 mb-4"><div class="flex justify-between mb-2"><span class="font-bold text-blue-600">${f.dir}</span><span class="text-xs text-gray-400">${f.date}</span></div><div class="text-lg font-bold mb-1">${f.airline}</div><div class="text-sm text-gray-600 mb-2">${f.time}</div><div class="text-xs bg-gray-100 p-2 rounded text-gray-500">座位: ${f.seat}</div></div>`).join('')}
            `;
        }

        function renderDaySelector() {
            daySelector.innerHTML = staticData.days.map(day => `<button onclick="changeDay(${day.id})" class="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition-colors whitespace-nowrap ${day.id === currentDayId ? 'bg-gray-800 text-white shadow-md' : 'bg-white text-gray-500 border border-gray-200'}">${day.date}</button>`).join('');
        }
        function changeDay(id) {
            currentDayId = id;
            renderDaySelector();
            headerSubtitle.innerText = staticData.days.find(d => d.id === id).date;
            renderItinerary(id);
        }
        function getTypeColor(type) {
            const map = { transport: "bg-blue-400", food: "bg-orange-400", sight: "bg-emerald-400", hotel: "bg-indigo-400", shopping: "bg-pink-400", move: "bg-gray-400", activity: "bg-yellow-500" };
            return map[type] || "bg-gray-400";
        }

        init();
    </script>
</body>
</html>
